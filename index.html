<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="headerTitle">AI Website Style Gallery</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 包含所有可能用到的字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;600;700;900&family=Open+Sans:wght@400;600&family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700&family=Press+Start+2P&family=Roboto+Mono&family=Roboto:wght@400;500;700&family=Space+Mono&family=Special+Elite&family=Times+New+Roman&display=swap" rel="stylesheet">

    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="language-switcher.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 data-translate="headerTitle">AI Website Style Gallery</h1>
            <p data-translate="headerSubtitle">Explore various web design styles generated by AI and their <span class="highlight">AI Prompt</span> examples</p>
            <button id="language-switcher" class="language-btn">
                <img src="img/cnen.svg" alt="Switch Language">
            </button>
            <!-- 可选：添加一个重置主题的按钮 -->
        </div>
    </header>

    <!-- Main content area where style cards will be loaded -->
    <!-- 关键：确保 main 标签同时有 id 和 class -->
    <main class="container card-grid-container" id="main-content">
        <!-- Initial loading message -->
        <div class="loading-message" data-translate="loadingMessage">Loading styles...</div>
        <!-- The card grid will be inserted here by script.js -->
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year"></span> <span data-translate="footerText">AI Website Style Gallery</span></p>
        </div>
    </footer>

    <!-- Link to your JavaScript file (defer ensures it runs after HTML parsing) -->
    <script src="translations.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
